name: build

on:
  push:
    branches: [ main, apiv4 ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - uses: nuget/setup-nuget@v2

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore
      run: nuget restore Elmah.Io.WinUI.sln

    - name: Check for vulnerable packages
      shell: bash
      run: |
        set -e # This will cause the script to exit on the first error
        OUTPUT=$(dotnet list src/Elmah.Io.WinUI/Elmah.Io.WinUI.csproj package --vulnerable)
        echo "$OUTPUT"
        if echo "$OUTPUT" | grep -q 'no vulnerable packages'; then
          echo "No vulnerable packages found"
        else
          if echo "$OUTPUT" | grep -q 'vulnerable'; then
            echo "Vulnerable packages found"
            exit 1
          fi
        fi

    - name: Build
      run: msbuild Elmah.Io.WinUI.sln /t:Build /p:Configuration=Release /p:Version=6.0.${{ github.run_number }}-pre

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack --no-build --configuration Release src/Elmah.Io.WinUI/Elmah.Io.WinUI.csproj /p:Version=6.0.${{ github.run_number }}-pre

    - name: Install dotnet-validate
      run: dotnet tool install --global dotnet-validate --version 0.0.1-preview.537

    - name: Validate
      run: dotnet-validate package local src/Elmah.Io.WinUI/bin/Release/Elmah.Io.WinUI.6.0.${{ github.run_number }}-pre.nupkg

    - name: Push to nuget.org
      run: dotnet nuget push src/Elmah.Io.WinUI/bin/Release/Elmah.Io.WinUI.6.0.${{ github.run_number }}-pre.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      if: ${{ github.event_name == 'push' }}

    - name: Refresh Bugster
      uses: elmahio/actions/refresh-bugster-repository@v1.2
      with:
        signing: ${{ secrets.BUGSTER_SIGNING_KEY }}
        url: ${{ secrets.FUNCTION_APP_URL }}
        repository: ${{ github.event.repository.name }}
      if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}